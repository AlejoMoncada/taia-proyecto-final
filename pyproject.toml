[project]
name = "ecg-taia"
version = "0.1.0"
description = "Clasificacion multietiqueta de ECG (PTB-XL, 5 superclases) - Proyecto final TAIA, Grupo 9"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "wfdb>=4.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "tqdm>=4.66",
    "torch>=2.2",
    "reportlab>=5.1.0",
    "pypdf>=6.21.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

# Torch con CUDA 12.6 en Windows/Linux (tambien corre en CPU si no hay GPU). En macOS sale de PyPI.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
