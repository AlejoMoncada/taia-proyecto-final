[project]
name = "ecg-taia"
version = "0.1.0"
description = "Clasificacion multietiqueta de ECG (PTB-XL, 5 superclases) - Proyecto final TAIA, Grupo 9"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "wfdb>=4.1",
    "pyyaml>=6.0",
    "matplotlib>=3.8",
    "requests>=2.31",
    "tqdm>=4.66",
    "torch>=2.2",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
